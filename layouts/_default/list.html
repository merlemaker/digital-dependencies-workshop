{{ define "main" }}
<div class="page-header">
    <div class="container">
        <h1>{{ .Title }}</h1>
        {{ with .Params.intro }}<p class="page-intro">{{ . }}</p>{{ end }}
    </div>
</div>
<div class="page-body">
    <div class="container">
        <div class="prose {{ if .Params.wide }}wide{{ end }}">
            {{ .Content }}
        </div>
    </div>
</div>
{{ end }}
